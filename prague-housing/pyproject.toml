[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prague-housing"
version = "0.1.0"
description = "Periodic Prague flat/house watcher with public-transport duration and frequency scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prague-housing = "prague_housing.cli:main"

[tool.setuptools.packages.find]
include = ["prague_housing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
